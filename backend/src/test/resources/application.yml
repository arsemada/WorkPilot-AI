spring:
  config:
    import: "optional:classpath:test-empty.properties"
  application:
    name: workpilot-ai-test
  datasource:
    url: jdbc:h2:mem:workpilot_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 0
  servlet:
    session:
      cookie:
        name: WORKPILOT_SESSION
        http-only: true
        same-site: lax
        secure: false

workpilot:
  cors:
    allowed-origins: http://localhost:3000
  documents:
    directory: target/test-documents
    max-bytes: 10485760
    processing-sync: true
  ai:
    api-key: test-key-not-used
    base-url: http://127.0.0.1:9/v1
    model: gpt-4o-mini
    timeout: 2s
    max-output-tokens: 100
    max-message-chars: 4000
    max-history-messages: 20
    daily-message-limit: 2
    embedding-model: text-embedding-3-small
    embedding-model-version: "3"
    embedding-dimensions: 8
    max-cosine-distance: 0.2
    retrieval-limit: 4
    vector-store: json
    max-tool-calls: 3
    tool-budget: 5s
  workflow:
    retry-backoff: 0s
    overdue-cron: "0 0 0 31 2 ?"
    activity-cron: "0 0 0 31 2 ?"
    retry-delay-ms: 86400000
    retry-initial-delay-ms: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
