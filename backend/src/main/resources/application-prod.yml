# Activated with SPRING_PROFILES_ACTIVE=prod.
# Credentials still come from the environment. This file does not contain secrets.

spring:
  flyway:
    baseline-on-migrate: false
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
      keepalive-time: 30000

server:
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
  tomcat:
    connection-timeout: 20s
    max-http-form-post-size: 12MB
    max-swallow-size: 12MB

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN
