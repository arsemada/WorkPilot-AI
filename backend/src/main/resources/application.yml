spring:
  application:
    name: workpilot-ai
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration,classpath:db/vendor/postgresql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      cookie:
        name: WORKPILOT_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
      timeout: 30m

workpilot:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  documents:
    directory: ${DOCUMENT_STORAGE_DIR:data/documents}
    max-bytes: 10485760
    processing-sync: false
  ai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    timeout: ${OPENAI_TIMEOUT:30s}
    max-output-tokens: 800
    max-message-chars: 4000
    max-history-messages: 20
    daily-message-limit: 40
    embedding-model: ${EMBEDDING_MODEL:text-embedding-3-small}
    embedding-model-version: ${EMBEDDING_MODEL_VERSION:3}
    embedding-dimensions: ${EMBEDDING_DIMENSIONS:1536}
    max-cosine-distance: 0.45
    retrieval-limit: 4
    vector-store: ${VECTOR_STORE:pgvector}
    max-tool-calls: 3
    tool-budget: 15s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
