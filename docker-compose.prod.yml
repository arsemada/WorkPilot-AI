# Production overlay. Do not use this file by itself.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml config
#
# It expects HTTPS in front of the containers, a real CORS origin, and a
# password that is not the local placeholder. It does not publish PostgreSQL,
# the API, or the frontend on the host. A reverse proxy on the Docker network
# should be the only public entry point. See deploy/Caddyfile.

services:
  postgres:
    ports: !reset []

  backend:
    ports: !reset []
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SESSION_COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS to the public frontend origin}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-30s}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION:-3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    ports: !reset []
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
